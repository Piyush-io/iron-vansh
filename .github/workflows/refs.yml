# Captures design reference pages (ironclad-site/design/refs/targets.json) on GitHub's runners and
# commits screenshots + HTML to ironclad-site/design/refs/.
name: Capture references

on:
  workflow_dispatch:
  push:
    paths:
      - 'ironclad-site/design/refs/targets.json'
      - 'ironclad-site/scripts/capture-refs.mjs'
      - '.github/workflows/refs.yml'

permissions:
  contents: write

concurrency:
  group: refs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ironclad-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/capture-refs.mjs
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/refs public/docs
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Capture design references [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
