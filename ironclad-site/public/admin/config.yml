# Ironclad CMS (Sveltia CMS): edit Insights, Media coverage, Investor updates and Regulatory documents at /admin.
# Each save is a commit to `main`, which rebuilds the live site. Paths are relative to the repository root.
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.217.0/schema/sveltia-cms.json

backend:
  name: github
  repo: Piyush-io/iron-vansh
  branch: main
  # Username/password sign-in goes through our login gate (cms-auth/, see ADMIN.md). After deploying it, uncomment:
  # base_url: https://ironclad-cms-auth.<your-account>.workers.dev
  commit_messages:
    create: 'CMS: add {{collection}} “{{slug}}”'
    update: 'CMS: update {{collection}} “{{slug}}”'
    delete: 'CMS: delete {{collection}} “{{slug}}”'
    uploadMedia: 'CMS: upload “{{path}}”'
    deleteMedia: 'CMS: delete “{{path}}”'

app_title: Ironclad CMS
logo:
  src: /images/icon-180.png
site_url: https://ironcladamc.com

# images go to /images/uploads; PDF fields override this to /docs
media_folder: ironclad-site/public/images/uploads
public_folder: /images/uploads

output:
  omit_empty_optional_fields: true

collections:
  - name: blog
    label: Insights
    label_singular: Post
    description: Articles on the Insights page (/blogs). The newest three also appear on the home page.
    folder: ironclad-site/src/content/blog
    create: true
    slug: '{{year}}-{{month}}-{{slug}}'
    preview_path: /blogs/{{slug}}
    summary: '{{title}} · {{date | date("D MMM YYYY")}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, hint: 'Short and specific, under 80 characters.' }
      - { name: date, label: Publish date, widget: datetime, time_format: false, date_format: 'DD MMM YYYY', format: 'YYYY-MM-DD' }
      - { name: summary, label: Summary, widget: text, hint: 'One or two sentences. Shown on the post list and in search results.' }
      - { name: cover, label: Cover image, widget: image, required: false, hint: 'Optional. Landscape, at least 1600px wide.' }
      - { name: coverAlt, label: Cover image description, required: false, hint: 'Describe the image for screen readers.' }
      - { name: body, label: Article, widget: markdown, modes: [rich_text], buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list] }

singletons:
  - name: press
    label: Media coverage
    file: ironclad-site/src/data/press.json
    icon: newspaper
    fields:
      - name: items
        label: Articles
        label_singular: Article
        widget: list
        add_to_top: true
        summary: '{{outlet}}: {{text | truncate(60)}}'
        hint: New articles go to the top. Drag to reorder.
        fields:
          - { name: outlet, label: Publication, hint: 'e.g. The Economic Times' }
          - { name: url, label: Link to the article, pattern: ['^https?://', 'Must be a full link starting with https://'] }
          - { name: text, label: Excerpt, widget: text, hint: 'A sentence or two quoted from the article.' }

  - name: investor-updates
    label: Investor updates
    file: ironclad-site/src/data/investor-updates.json
    icon: description
    fields:
      - name: items
        label: Updates
        label_singular: Update
        widget: list
        add_to_top: true
        summary: '{{title}}'
        hint: New updates go to the top. Drag to reorder.
        fields:
          - { name: title, label: Title, hint: 'e.g. October Investor Update' }
          - { name: summary, label: Summary, widget: text }
          - { name: points, label: Key points, widget: list, required: false, hint: 'Optional bullet points under the summary.' }
          - { name: file, label: PDF, widget: file, accept: application/pdf, media_folder: /ironclad-site/public/docs, public_folder: /docs }

  - name: regulatory-docs
    label: Regulatory documents
    file: ironclad-site/src/data/regulatory-docs.json
    icon: gavel
    fields:
      - { name: disclosure, label: Disclosure Document, widget: file, accept: application/pdf, media_folder: /ironclad-site/public/docs, public_folder: /docs }
      - { name: sebiCertificate, label: SEBI Registration Certificate, widget: file, accept: application/pdf, media_folder: /ironclad-site/public/docs, public_folder: /docs }
      - { name: investorCharter, label: Investor Charter, widget: file, accept: application/pdf, media_folder: /ironclad-site/public/docs, public_folder: /docs }
      - { name: grievance, label: Investor Grievance (monthly), widget: file, accept: application/pdf, media_folder: /ironclad-site/public/docs, public_folder: /docs }
      - { name: complaintsPms, label: 'Complaints Data, PMS (monthly)', widget: file, accept: application/pdf, media_folder: /ironclad-site/public/docs, public_folder: /docs }
      - { name: complaintsAif, label: 'Complaints Data, AIF (monthly)', widget: file, accept: application/pdf, media_folder: /ironclad-site/public/docs, public_folder: /docs }
